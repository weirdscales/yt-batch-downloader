name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev automake libltdl-dev build-essential \
            ccache libsqlite3-dev lld liblzma-dev

      - name: Cache Buildozer Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-v1-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-v1-

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install buildozer cython==0.29.36

      - name: Build Android Debug APK
        run: |
          yes | buildozer -v android debug || buildozer -v android debug

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-batch-downloader-apk
          path: bin/*.apk
          if-no-files-found: error
